<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周报提交系统</title>
    <!-- 外部资源加载 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">

    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        accent: '#0ea5e9',
                        neutral: '#f1f5f9',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- 自定义工具类 -->
    <style type="text/tailwindcss">
        @layer utilities {
            /* 基础工具类 */
            .content-auto {
                content-visibility: auto;
            }

            /* 表单相关 */
            .input-focus {
                @apply focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none;
            }
            .form-input {
                @apply w-full px-10 py-3 pr-10 border border-gray-300 rounded-lg input-focus transition-all duration-200;
            }
            .form-label {
                @apply block text-sm font-medium text-gray-700 mb-1;
            }

            /* 按钮相关 */
            .btn {
                @apply font-medium py-2 px-4 rounded-lg transition-all duration-200 shadow-md hover:shadow-lg transform hover:-translate-y-0.5;
            }
            .btn-primary {
                @apply btn bg-primary hover:bg-primary/90 text-white;
            }
            .btn-section {
                @apply mb-3;
            }

            /* 布局相关 */
            .form-container {
                @apply bg-white rounded-xl shadow-lg p-6 md:p-8 max-w-4xl mx-auto my-8 animate-fade-in;
            }
            .section-title {
                @apply text-xl font-semibold text-gray-800 mb-4 mt-6 flex items-center;
            }

            /* 分割线 */
            .divider {
                @apply my-6 border-t border-gray-200 relative;
            }
            .divider-text {
                @apply absolute left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white px-4 text-gray-500 text-sm font-medium;
            }

            /* 输入框图标 */
            .input-icon {
                @apply absolute left-0 flex items-center pl-3 text-gray-500 pointer-events-none;
                top: 35%;
                transform: translateY(-35%);
            }
            .input-icon-person {
                @apply absolute left-0 flex items-center pl-3 text-gray-500 pointer-events-none;
                top: 35%;
                /*transform: translateY(-35%);*/
            }

            /* 下拉框右侧箭头 */
            .select-arrow {
                @apply absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 pointer-events-none;
            }

            /* 下拉框样式 */
            .form-select {
                @apply w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg input-focus transition-all duration-200 appearance-none bg-none cursor-pointer;
                background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 20 20' %3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
                background-position: right 0.75rem center;
                background-repeat: no-repeat;
                background-size: 1.5em 1.5em;
            }

            /* 文本域计数 */
            .char-counter {
                @apply absolute bottom-2 right-2 text-xs text-gray-500;
            }
            .char-counter-exceed {
                @apply text-danger;
            }

            /* Tab 页样式 */
            .tab-item {
                @apply px-6 py-3 font-medium text-gray-600 cursor-pointer transition-all border-b-2 border-transparent;
            }
            .tab-item.active {
                @apply text-primary border-primary font-semibold;
            }
            .tab-content {
                @apply hidden;
            }
            .tab-content.active {
                @apply block animate-fade-in;
            }
        }
    </style>
</head>

<body class="bg-gray-50 font-inter">
<div class="form-container">
    <!-- 页面标题 -->
    <!--    <h1 class="text-2xl font-bold text-center text-gray-800 mb-6" aria-label="部门周报提交表单">周报</h1>-->

    <!-- Tab 页签切换 -->
    <div class="border-b border-gray-200 mb-6">
        <div class="flex space-x-4">
            <div class="tab-item active" data-tab="dept-report">
                <i class="fa fa-file-text-o mr-2"></i>部门周报提交
            </div>
            <div class="tab-item" data-tab="personal-report">
                <i class="fa fa-user-circle-o mr-2"></i>个人周报查询
            </div>
        </div>
    </div>

    <!-- 原有部门周报提交 Tab 内容 -->
    <div class="tab-content active" id="dept-report">
        <!-- 人员列表输入区域 -->
        <div class="mb-4">
            <label for="personList" class="form-label">
                <i class="fa fa-users mr-1"></i>人员列表（用顿号分隔，结尾不要留空格）
            </label>
            <div class="relative">
                    <span class="input-icon">
                        <i class="fa fa-users"></i>
                    </span>
                <input
                        type="text"
                        id="personList"
                        class="form-input"
                        aria-describedby="personListHint"
                        value="周成、傅兴佳、何名忠、黄少菱、江剑乐、林伟恒、卢炜东"
                >
                <p id="personListHint" class="mt-1 text-xs text-gray-500">示例：张三、李四、王五</p>
            </div>
        </div>

        <!-- 重新生成按钮 -->
        <div class="btn-section">
            <button
                    id="regenerateBtn"
                    class="btn-primary mt-4"
                    aria-label="重新生成人员表单控件"
            >
                <i class="fa fa-refresh mr-2"></i>重新生成
            </button>
        </div>

        <!-- 主表单 -->
        <form id="weeklyReportForm" class="space-y-6" novalidate>
            <!-- 会议基本信息 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 会议地点 -->
                <div>
                    <label for="meetingAddress" class="form-label">
                        <i class="fa fa-map-marker mr-1"></i>会议地点
                    </label>
                    <div class="relative">
                            <span class="input-icon">
                                <i class="fa fa-map-marker"></i>
                            </span>
                        <select
                                id="meetingAddress"
                                name="meetingAddress"
                                class="form-select"
                                required
                                aria-required="true"
                        >
                            <option value="三楼一">三楼一</option>
                            <option value="三楼二">三楼二</option>
                            <option value="三楼三">三楼三</option>
                            <option value="二楼大会议室">二楼大会议室</option>
                            <option value="二楼小会议室">二楼小会议室</option>
                        </select>
                    </div>
                </div>

                <!-- 主持人 -->
                <div>
                    <label for="host" class="form-label">
                        <i class="fa fa-user mr-1"></i>主持人
                    </label>
                    <div class="relative">
                            <span class="input-icon">
                                <i class="fa fa-user"></i>
                            </span>
                        <select
                                id="host"
                                name="host"
                                class="form-select"
                                required
                                aria-required="true"
                        ></select>
                    </div>
                </div>
            </div>

            <!-- 会议评审内容 -->
            <div class="mt-6">
                <label for="reviewContent" class="form-label">
                    <i class="fa fa-commenting mr-1"></i>会议评审内容
                </label>
                <div class="relative">
                    <span class="input-icon" style="top: 10%;">
                        <i class="fa fa-commenting"></i>
                    </span>
                    <textarea
                            id="reviewContent"
                            name="reviewContent"
                            class="form-input h-24 resize-none"
                            aria-label="会议评审内容"
                    ></textarea>
                </div>
            </div>

            <!-- 分割线 -->
            <div class="divider">
                <span class="divider-text">周报内容</span>
            </div>

            <!-- 动态生成的周报内容区域 -->
            <div id="reportSections" class="space-y-6" aria-live="polite"></div>

            <!-- 提交按钮 -->
            <div class="flex justify-center mt-8">
                <button
                        type="submit"
                        id="submitBtn"
                        class="btn-primary w-full md:w-auto"
                        aria-label="提交周报表单"
                >
                    <i class="fa fa-paper-plane mr-2"></i>提交周报
                </button>
            </div>
        </form>

        <!-- 响应消息提示 -->
        <div id="responseMessage" class="mt-6 hidden" aria-live="assertive"></div>
    </div>

    <!-- 新增个人周报查询 Tab 内容 -->
    <div class="tab-content" id="personal-report">
        <form id="personalReportForm" class="space-y-6">
            <!-- 账号输入 -->
            <div class="mb-4">
                <label for="userAccount" class="form-label">
                    <i class="fa fa-id-card mr-1"></i>账号
                </label>
                <div class="relative">
                        <span class="input-icon-person">
                            <i class="fa fa-id-card"></i>
                        </span>
                    <input
                            type="text"
                            id="userAccount"
                            class="form-input"
                            placeholder="请输入您的账号"
                            required
                            aria-required="true"
                    >
                </div>
            </div>

            <!-- 密码输入 -->
            <div class="mb-4">
                <label for="userPassword" class="form-label">
                    <i class="fa fa-lock mr-1"></i>密码
                </label>
                <div class="relative">
                        <span class="input-icon-person">
                            <i class="fa fa-lock"></i>
                        </span>
                    <input
                            type="password"
                            id="userPassword"
                            class="form-input"
                            placeholder="请输入您的密码"
                            required
                            aria-required="true"
                    >
                </div>
            </div>

            <!-- 获取个人周报按钮 -->
            <div class="btn-section">
                <button
                        type="button"
                        id="getPersonalReportBtn"
                        class="btn-primary mt-4 w-full md:w-auto"
                        aria-label="获取个人周报"
                >
                    <i class="fa fa-search mr-2"></i>获取个人周报
                </button>
            </div>

            <!-- 个人周报回显区域 -->
            <div class="mt-6">
                <label for="personalReportContent" class="form-label">
                    <i class="fa fa-file-text mr-1"></i>个人周报内容
                </label>
                <div class="relative">
                    <span class="input-icon" style="top: 10%;">
                        <i class="fa fa-file-text"></i>
                    </span>
                    <textarea
                            id="personalReportContent"
                            class="form-input h-64 resize-none"
                            aria-label="个人周报内容"
                            readonly
                            placeholder="个人周报内容将在这里显示..."
                    ></textarea>
                </div>
            </div>

            <!-- 个人周报操作提示 -->
            <div id="personalReportMessage" class="mt-6 hidden p-4 rounded-lg" aria-live="assertive"></div>
        </form>
    </div>
</div>

<script>
    // 全局常量定义
    const CONFIG = {
        API_BASE_URL: 'http://localhost:9123',
        API_ENDPOINT: '/api/weekly_report',
        PERSONAL_API_ENDPOINT: '/api/personal_report',
        MAX_CONTENT_LENGTH: 2000,
        MESSAGE_DISPLAY_DURATION: 3000
    };

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function () {
        // 初始化DOM元素引用
        const elements = {
            // 原有元素
            personListInput: document.getElementById('personList'),
            hostSelect: document.getElementById('host'),
            reportSections: document.getElementById('reportSections'),
            form: document.getElementById('weeklyReportForm'),
            submitBtn: document.getElementById('submitBtn'),
            regenerateBtn: document.getElementById('regenerateBtn'),
            responseMessage: document.getElementById('responseMessage'),

            // 新增Tab相关元素
            tabItems: document.querySelectorAll('.tab-item'),
            tabContents: document.querySelectorAll('.tab-content'),

            // 新增个人周报相关元素
            personalReportForm: document.getElementById('personalReportForm'),
            userAccountInput: document.getElementById('userAccount'),
            userPasswordInput: document.getElementById('userPassword'),
            getPersonalReportBtn: document.getElementById('getPersonalReportBtn'),
            personalReportContent: document.getElementById('personalReportContent'),
            personalReportMessage: document.getElementById('personalReportMessage')
        };

        // ====================== 原有核心功能：重新生成 & 主持人下拉 ======================
        // 解析人员列表
        function parsePersonList() {
            const text = elements.personListInput.value.trim();
            return text.split('、').filter(name => name.trim() !== '');
        }

        // 更新主持人下拉选项
        function updateHostOptions(persons) {
            elements.hostSelect.innerHTML = '';
            persons.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                elements.hostSelect.appendChild(option);
            });
        }

        // 生成个人周报输入区域 —— 每人仅一个输入框
        function generateReportSections(persons) {
            elements.reportSections.innerHTML = '';
            persons.forEach((name, index) => {
                const section = document.createElement('div');
                section.className = 'bg-gray-50 p-4 rounded-lg border border-gray-200';
                section.innerHTML = `
                    <div class="section-title !mt-0">
                        <i class="fa fa-user-circle-o mr-2 text-primary"></i>
                        ${name}
                    </div>
                    <div class="mt-2">
                        <label class="form-label">个人周报内容</label>
                        <div class="relative">
                            <span class="input-icon" style="top:10%;"><i class="fa fa-pencil"></i></span>
                            <textarea name="weeklyReportContent" data-name="${name}" class="form-input h-32 resize-none" placeholder="请填写个人周报内容"></textarea>
                        </div>
                    </div>
                `;
                elements.reportSections.appendChild(section);
            });
        }

        // 重新生成按钮点击事件
        function regenerateForm() {
            const persons = parsePersonList();
            if (persons.length === 0) {
                showMessage(elements.responseMessage, '请输入有效的人员列表！', 'error');
                return;
            }
            updateHostOptions(persons);
            generateReportSections(persons);
            showMessage(elements.responseMessage, '成功生成人员周报表单！', 'success');
        }

        // 绑定原有按钮事件
        elements.regenerateBtn.addEventListener('click', regenerateForm);

        // 页面初始化自动生成
        regenerateForm();

        // ====================== ✅ 唯一修改：修复提交周报响应逻辑 ======================
        elements.form.addEventListener('submit', async function (e) {
            e.preventDefault();
            try {
                elements.submitBtn.disabled = true;
                elements.submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>提交中...';

                const formData = new FormData(elements.form);
                const baseData = Object.fromEntries(formData.entries());

                const personalReports = [];
                const reportTextareas = document.querySelectorAll('textarea[name="weeklyReportContent"]');

                reportTextareas.forEach(textarea => {
                    personalReports.push({
                        name: textarea.dataset.name,
                        weeklyReportContent: textarea.value.trim()
                    });
                });

                const submitData = {
                    meetingAddress: baseData.meetingAddress,
                    host: baseData.host,
                    reviewContent: baseData.reviewContent,
                    personalWeeklyReports: personalReports
                };

                const response = await fetch(`${CONFIG.API_BASE_URL}${CONFIG.API_ENDPOINT}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(submitData)
                });

                // ========== 修复开始 ==========
                if (response.ok) {
                    // 1. 从响应头 Content-Disposition 提取文件名（后端返回优先）
                    let fileName = "部门周报.docx";
                    const disposition = response.headers.get('Content-Disposition');
                    if (disposition) {
                        try {
                            // 匹配 filename*=UTF-8''xxx.docx
                            const utf8Match = disposition.match(/filename\*=UTF-8''([^;]+)/i);
                            if (utf8Match && utf8Match[1]) {
                                fileName = decodeURIComponent(utf8Match[1]);
                            } else {
                                // 兼容 filename="xxx.docx"
                                const fileNameMatch = disposition.match(/filename="?([^";]+)"?/i);
                                if (fileNameMatch && fileNameMatch[1]) {
                                    fileName = fileNameMatch[1];
                                }
                            }
                        } catch (e) {
                            console.warn('文件名解析失败，使用默认值', e);
                        }
                    }

                    // 2. 下载文件
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);

                    showMessage(elements.responseMessage, '🎉 周报提交成功，文件已下载', 'success');
                } else {
                    // 后端返回错误JSON → 读取提示
                    const err = await response.json();
                    showMessage(elements.responseMessage, err.message || '提交失败', 'error');
                }
                // ========== 修复结束 ==========

            } catch (error) {
                console.error('提交异常：', error);
                showMessage(elements.responseMessage, '网络异常，提交失败！', 'error');
            } finally {
                elements.submitBtn.disabled = false;
                elements.submitBtn.innerHTML = '<i class="fa fa-paper-plane mr-2"></i>提交周报';
            }
        });

        // ====================== Tab 切换逻辑 ======================
        elements.tabItems.forEach(tab => {
            tab.addEventListener('click', function () {
                elements.tabItems.forEach(item => item.classList.remove('active'));
                elements.tabContents.forEach(content => content.classList.remove('active'));
                this.classList.add('active');
                const tabId = this.getAttribute('data-tab');
                document.getElementById(tabId).classList.add('active');
            });
        });

        // ====================== 个人周报查询逻辑 ======================
        elements.getPersonalReportBtn.addEventListener('click', async function() {
            elements.personalReportMessage.classList.add('hidden');
            elements.personalReportContent.value = '';

            const account = elements.userAccountInput.value.trim();
            const password = elements.userPasswordInput.value.trim();

            if (!account || !password) {
                showMessage(elements.personalReportMessage, '账号和密码不能为空！', 'error');
                return;
            }

            try {
                elements.getPersonalReportBtn.disabled = true;
                elements.getPersonalReportBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>加载中...';

                const response = await fetch(`${CONFIG.API_BASE_URL}${CONFIG.PERSONAL_API_ENDPOINT}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ account, password })
                });

                const result = await response.json();
                if (response.ok && result.success) {
                    elements.personalReportContent.value = result.data || '暂无个人周报数据';
                    showMessage(elements.personalReportMessage, '个人周报获取成功！', 'success');
                } else {
                    showMessage(elements.personalReportMessage, result.message || '获取个人周报失败，请重试', 'error');
                }
            } catch (error) {
                console.error('获取个人周报失败:', error);
                showMessage(elements.personalReportMessage, '网络异常，获取个人周报失败！', 'error');
            } finally {
                elements.getPersonalReportBtn.disabled = false;
                elements.getPersonalReportBtn.innerHTML = '<i class="fa fa-search mr-2"></i>获取个人周报';
            }
        });

        // ====================== 通用工具函数 ======================
        function showMessage(element, message, type) {
            element.className = 'mt-6 p-4 rounded-lg';
            if (type === 'success') {
                element.classList.add('bg-success/10', 'text-success', 'border', 'border-success/20');
            } else if (type === 'error') {
                element.classList.add('bg-danger/10', 'text-danger', 'border', 'border-danger/20');
            }
            element.textContent = message;
            element.classList.remove('hidden');
            setTimeout(() => element.classList.add('hidden'), CONFIG.MESSAGE_DISPLAY_DURATION);
        }
    });
</script>
</body>
</html>
