<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周报提交系统</title>
    <!-- 生产构建：Tailwind 与 Font Awesome 均已静态化到本地 vendor/，无外部 CDN 依赖 -->
    <link rel="stylesheet" href="vendor/tailwind.css">
    <link rel="stylesheet" href="vendor/font-awesome/css/font-awesome.min.css">
</head>

<body class="bg-gray-50 font-inter min-h-screen">
<div class="form-container">
    <!-- 页面标题 -->
    <header class="mb-6 text-center">
        <h1 class="text-2xl font-bold text-gray-800">周报提交系统</h1>
    </header>

    <!-- Tab 页签切换 -->
    <div class="border-b border-gray-200 mb-6">
        <div class="flex space-x-4" role="tablist">
            <div class="tab-item active" data-tab="dept-report" role="tab" aria-selected="true" tabindex="0">
                <i class="fa fa-file-text-o mr-2"></i>部门周报生成
            </div>
            <div class="tab-item" data-tab="personal-report" role="tab" aria-selected="false" tabindex="0">
                <i class="fa fa-user-circle-o mr-2"></i>个人周报查询
            </div>
        </div>
    </div>

    <!-- 部门周报提交 Tab 内容 -->
    <div class="tab-content active" id="dept-report" role="tabpanel">
        <!-- 人员列表输入区域 -->
        <div class="mb-4">
            <label for="personList" class="form-label">
                <i class="fa fa-users mr-1"></i>人员列表（用顿号「、」分隔，结尾不要留空格）
            </label>
            <div class="relative">
                <span class="input-icon"><i class="fa fa-users"></i></span>
                <input
                        type="text"
                        id="personList"
                        class="form-input"
                        aria-describedby="personListHint"
                        value="周成、傅兴佳、何名忠、黄少菱、江剑乐、林伟恒、卢炜东"
                >
            </div>
            <p id="personListHint" class="mt-1 text-xs text-gray-500">示例：张三、李四、王五</p>
        </div>

        <!-- 重新生成按钮 -->
        <div class="btn-section">
            <button id="regenerateBtn" class="btn-primary" aria-label="重新生成人员表单控件">
                <i class="fa fa-refresh mr-2"></i>重新生成
            </button>
        </div>

        <!-- 主表单 -->
        <form id="weeklyReportForm" class="space-y-6" novalidate>
            <!-- 会议基本信息 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 会议地点 -->
                <div>
                    <label for="meetingAddress" class="form-label">
                        <i class="fa fa-map-marker mr-1"></i>会议地点 <span class="text-danger">*</span>
                    </label>
                    <div class="relative">
                        <span class="input-icon"><i class="fa fa-map-marker"></i></span>
                        <select id="meetingAddress" name="meetingAddress" class="form-select" required aria-required="true">
                            <option value="三楼一">三楼一</option>
                            <option value="三楼二">三楼二</option>
                            <option value="三楼三">三楼三</option>
                            <option value="二楼大会议室">二楼大会议室</option>
                            <option value="二楼小会议室">二楼小会议室</option>
                        </select>
                    </div>
                </div>

                <!-- 主持人 -->
                <div>
                    <label for="host" class="form-label">
                        <i class="fa fa-user mr-1"></i>主持人 <span class="text-danger">*</span>
                    </label>
                    <div class="relative">
                        <span class="input-icon"><i class="fa fa-user"></i></span>
                        <select id="host" name="host" class="form-select" required aria-required="true"></select>
                    </div>
                </div>
            </div>

            <!-- 会议评审内容 -->
            <div class="mt-6">
                <label for="reviewContent" class="form-label">
                    <i class="fa fa-commenting mr-1"></i>会议评审内容
                </label>
                <div class="relative">
                    <span class="input-icon--top"><i class="fa fa-commenting"></i></span>
                    <textarea id="reviewContent" name="reviewContent" class="form-input h-24 resize-none"
                              aria-label="会议评审内容" placeholder="请填写本次会议评审内容"></textarea>
                </div>
            </div>

            <!-- 分割线 -->
            <div class="divider">
                <span class="divider-text">周报内容</span>
            </div>

            <!-- 动态生成的周报内容区域 -->
            <div id="reportSections" class="space-y-6" aria-live="polite"></div>

            <!-- 提交按钮 -->
            <div class="flex justify-center mt-8">
                <button type="submit" id="submitBtn" class="btn-primary w-full md:w-auto" aria-label="提交周报表单">
                    <i class="fa fa-paper-plane mr-2"></i>提交周报
                </button>
            </div>
        </form>

        <!-- 响应消息提示 -->
        <div id="responseMessage" class="mt-6 hidden" role="alert" aria-live="assertive"></div>
    </div>

    <!-- 个人周报查询 Tab 内容 -->
    <div class="tab-content" id="personal-report" role="tabpanel">
        <form id="personalReportForm" class="space-y-6">
            <!-- 账号输入 -->
            <div class="mb-4">
                <label for="userAccount" class="form-label">
                    <i class="fa fa-id-card mr-1"></i>账号 <span class="text-danger">*</span>
                </label>
                <div class="relative">
                    <span class="input-icon"><i class="fa fa-id-card"></i></span>
                    <input type="text" id="userAccount" class="form-input" placeholder="请输入您的账号"
                           autocomplete="username" required aria-required="true">
                </div>
            </div>

            <!-- 密码输入 -->
            <div class="mb-4">
                <label for="userPassword" class="form-label">
                    <i class="fa fa-lock mr-1"></i>密码 <span class="text-danger">*</span>
                </label>
                <div class="relative">
                    <span class="input-icon"><i class="fa fa-lock"></i></span>
                    <input type="password" id="userPassword" class="form-input" placeholder="请输入您的密码"
                           autocomplete="current-password" required aria-required="true">
                </div>
            </div>

            <!-- 获取个人周报按钮 -->
            <div class="btn-section">
                <p class="text-xs text-danger mb-2">系统不会保存您的账号密码，仅用于获取登录认证</p>
                <div class="flex flex-wrap gap-3">
                    <button type="button" id="getPersonalReportBtn" class="btn-primary" aria-label="获取个人周报">
                        <i class="fa fa-search mr-2"></i>获取个人周报
                    </button>
                    <button type="button" id="copyPersonalReportBtn" class="btn-ghost" aria-label="复制周报内容" disabled>
                        <i class="fa fa-copy mr-2"></i>复制内容
                    </button>
                </div>
            </div>

            <!-- 个人周报回显区域 -->
            <div class="mt-6">
                <label for="personalReportContent" class="form-label">
                    <i class="fa fa-file-text mr-1"></i>个人周报内容
                </label>
                <div class="relative">
                    <span class="input-icon--top"><i class="fa fa-file-text"></i></span>
                    <textarea id="personalReportContent" class="form-input h-64 resize-none"
                              aria-label="个人周报内容" readonly placeholder="个人周报内容将在这里显示..."></textarea>
                </div>
            </div>

            <!-- 个人周报操作提示 -->
            <div id="personalReportMessage" class="mt-6 hidden p-4 rounded-lg" role="alert" aria-live="assertive"></div>
        </form>
    </div>
</div>

<script>
    'use strict';

    // 全局常量定义
    // 本地开发地址（与本地后端 http://localhost:9123 同源，无跨域问题）；生产部署时把下方 API_BASE_URL 改回 'https://linwh.asia'
    const API_BASE_URL_DEV = 'http://localhost:9123';
    const API_BASE_URL_PRO = 'https://linwh.asia';

    const CONFIG = {
        API_BASE_URL: API_BASE_URL_DEV,          // 本地开发：http://localhost:9123
        // API_BASE_URL: API_BASE_URL_PRO,   // 生产环境
        API_ENDPOINT: '/report/weekly',
        PERSONAL_API_ENDPOINT: '/report/personal',
        API_TOKEN: '182719e01793d3ded2781c820cf0da7657b02d37',  // 与后端 app.security.api-token 保持一致（SHA-1("ecan-weekly-report"）；启用鉴权时必填
        ENCRYPTION_ENABLED: true,                // 与后端 app.encryption.enabled 保持一致；true 时启用请求/响应双向加密（RSA+AES 信封）
        MAX_CONTENT_LENGTH: 2000,
        MESSAGE_DISPLAY_DURATION: 4000
    };

    // ====================== 请求加密传输层（RSA-OAEP + AES-GCM） ======================
    // 与后端约定：RSA/ECB/OAEPWithSHA-1AndMGF1Padding（跨平台唯一互通组合）；AES/GCM/NoPadding，IV 12 字节，TAG 128 位；base64 为标准编码。
    const CryptoTransport = (function () {
        const RSA_PARAMS = { name: 'RSA-OAEP', hash: 'SHA-1' };
        const AES_PARAMS = { name: 'AES-GCM', length: 256 };
        let serverPublicKey = null;

        function b64(bytes) {
            let bin = '';
            const chunk = 0x8000;
            for (let i = 0; i < bytes.length; i += chunk) {
                bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
            }
            return btoa(bin);
        }

        function unb64(s) {
            const bin = atob(s);
            const out = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
            return out;
        }

        async function ensurePublicKey() {
            if (serverPublicKey) return serverPublicKey;
            const resp = await fetch(`${CONFIG.API_BASE_URL}/report/public-key`);
            if (!resp.ok) throw new Error('获取服务端公钥失败（' + resp.status + '）');
            const meta = await resp.json();
            const spki = unb64(meta.key);
            serverPublicKey = await crypto.subtle.importKey(
                'spki', spki, RSA_PARAMS, false, ['encrypt']
            );
            return serverPublicKey;
        }

        // 用服务端公钥包裹随机 AES 密钥，加密明文 JSON；返回 { envelope, aesKey }
        async function encryptBody(plainJson) {
            const pub = await ensurePublicKey();
            const aesKey = await crypto.subtle.generateKey(AES_PARAMS, true, ['encrypt', 'decrypt']);
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ctBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, aesKey,
                new TextEncoder().encode(plainJson));
            const aesRaw = new Uint8Array(await crypto.subtle.exportKey('raw', aesKey)); // 32 字节
            const wrappedBuf = await crypto.subtle.encrypt({ name: 'RSA-OAEP', hash: 'SHA-1' }, pub, aesRaw);
            // Web Crypto 返回 ArrayBuffer，b64() 需要 Uint8Array 才能正确切片
            const envelope = {
                k: b64(new Uint8Array(wrappedBuf)),
                iv: b64(iv),
                data: b64(new Uint8Array(ctBuf))
            };
            return { envelope: JSON.stringify(envelope), aesKey: aesKey };
        }

        async function decryptResponse(aesKey, envelopeJson) {
            const env = JSON.parse(envelopeJson);
            const iv = unb64(env.iv);
            const data = unb64(env.data);
            const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, aesKey, data);
            return new TextDecoder().decode(pt);
        }

        return { encryptBody: encryptBody, decryptResponse: decryptResponse };
    })();

    // 统一 POST：根据 CONFIG.ENCRYPTION_ENABLED 决定是否加密请求体 / 解密 JSON 响应。
    // 返回 { response, json, isFile }：isFile 表示响应为文件流（docx），需另行下载。
    async function postJson(endpoint, data) {
        const headers = {
            'X-Api-Token': CONFIG.API_TOKEN,
            'Content-Type': 'application/json'
        };
        let bodyToSend = JSON.stringify(data);
        let sessionKey = null;

        if (CONFIG.ENCRYPTION_ENABLED) {
            const enc = await CryptoTransport.encryptBody(JSON.stringify(data));
            bodyToSend = enc.envelope;
            sessionKey = enc.aesKey;
        }

        const response = await fetch(`${CONFIG.API_BASE_URL}${endpoint}`, {
            method: 'POST',
            headers: headers,
            body: bodyToSend
        });

        const contentType = response.headers.get('Content-Type') || '';
        const isFile = !!response.headers.get('Content-Disposition')
            || /octet-stream|officedocument/.test(contentType);

        let json = null;
        if (!isFile) {
            let text = await response.text();
            if (CONFIG.ENCRYPTION_ENABLED && sessionKey) {
                try {
                    text = await CryptoTransport.decryptResponse(sessionKey, text);
                } catch (e) {
                    console.warn('响应解密失败，按原文解析：', e);
                }
            }
            try {
                json = JSON.parse(text);
            } catch (_) {
                json = null;
            }
        }
        return { response: response, json: json, isFile: isFile };
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function () {
        const $ = (id) => document.getElementById(id);

        // 元素引用
        const elements = {
            personListInput: $('personList'),
            hostSelect: $('host'),
            meetingAddressSelect: $('meetingAddress'),
            reviewContent: $('reviewContent'),
            reportSections: $('reportSections'),
            form: $('weeklyReportForm'),
            submitBtn: $('submitBtn'),
            regenerateBtn: $('regenerateBtn'),
            responseMessage: $('responseMessage'),

            tabItems: document.querySelectorAll('.tab-item'),
            tabContents: document.querySelectorAll('.tab-content'),

            personalReportForm: $('personalReportForm'),
            userAccountInput: $('userAccount'),
            userPasswordInput: $('userPassword'),
            getPersonalReportBtn: $('getPersonalReportBtn'),
            copyPersonalReportBtn: $('copyPersonalReportBtn'),
            personalReportContent: $('personalReportContent'),
            personalReportMessage: $('personalReportMessage')
        };

        // ====================== 通用工具函数 ======================
        function showMessage(element, message, type) {
            element.className = 'mt-6 p-4 rounded-lg';
            if (type === 'success') {
                element.classList.add('bg-success/10', 'text-success', 'border', 'border-success/20');
            } else if (type === 'error') {
                element.classList.add('bg-danger/10', 'text-danger', 'border', 'border-danger/20');
            } else {
                element.classList.add('bg-primary/10', 'text-primary', 'border', 'border-primary/20');
            }
            element.textContent = message;
            element.classList.remove('hidden');
            // 避免重复定时器叠加
            if (element._timer) clearTimeout(element._timer);
            element._timer = setTimeout(() => element.classList.add('hidden'), CONFIG.MESSAGE_DISPLAY_DURATION);
        }

        function setFieldError(field, hasError) {
            field.classList.toggle('input-error', !!hasError);
            if (hasError) {
                field.setAttribute('aria-invalid', 'true');
            } else {
                field.removeAttribute('aria-invalid');
            }
        }

        // 为文本域挂载字数统计（带上限）
        function attachCharCounter(textarea, max) {
            const counter = document.createElement('span');
            counter.className = 'char-counter';
            textarea.parentElement.appendChild(counter);

            function update() {
                const len = textarea.value.length;
                counter.textContent = `${len} / ${max}`;
                counter.classList.toggle('char-counter-exceed', len > max);
            }

            textarea.setAttribute('maxlength', String(max));
            textarea.addEventListener('input', update);
            update();
            return update;
        }

        // ====================== 人员解析 / 主持人 / 周报区块 ======================
        function parsePersonList() {
            return elements.personListInput.value
                .split('、')
                .map((n) => n.trim())
                .filter((n) => n !== '');
        }

        function updateHostOptions(persons) {
            elements.hostSelect.innerHTML = '';
            persons.forEach((name) => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                elements.hostSelect.appendChild(option);
            });
        }

        function generateReportSections(persons) {
            elements.reportSections.innerHTML = '';
            persons.forEach((name) => {
                const section = document.createElement('div');
                section.className = 'bg-gray-50 p-4 rounded-lg border border-gray-200';
                section.innerHTML = `
                    <div class="section-title !mt-0">
                        <i class="fa fa-user-circle-o mr-2 text-primary"></i>${name}
                    </div>
                    <div class="mt-2">
                        <label class="form-label">个人周报内容</label>
                        <div class="relative">
                            <span class="input-icon--top"><i class="fa fa-pencil"></i></span>
                            <textarea name="weeklyReportContent" data-name="${name}"
                                      class="form-input h-32 resize-none"
                                      placeholder="请填写个人周报内容"></textarea>
                        </div>
                    </div>
                `;
                elements.reportSections.appendChild(section);
                const ta = section.querySelector('textarea');
                attachCharCounter(ta, CONFIG.MAX_CONTENT_LENGTH);
                ta.addEventListener('input', () => setFieldError(ta, false));
            });
        }

        function regenerateForm() {
            const persons = parsePersonList();
            if (persons.length === 0) {
                showMessage(elements.responseMessage, '请输入有效的人员列表！', 'error');
                return;
            }

            // 已有填写内容时，避免误清空
            const hasContent = Array.from(
                elements.reportSections.querySelectorAll('textarea[name="weeklyReportContent"]')
            ).some((ta) => ta.value.trim() !== '');
            if (hasContent && !window.confirm('重新生成将清空已填写的个人周报内容，确定继续？')) {
                return;
            }

            updateHostOptions(persons);
            generateReportSections(persons);
            showMessage(elements.responseMessage, `已为 ${persons.length} 位成员生成周报表单`, 'success');
        }

        elements.regenerateBtn.addEventListener('click', regenerateForm);
        // 页面初始化自动生成
        regenerateForm();

        // 评审内容字数统计（非必填）
        attachCharCounter(elements.reviewContent, CONFIG.MAX_CONTENT_LENGTH);

        // ====================== 提交周报 ======================
        elements.form.addEventListener('submit', async function (e) {
            e.preventDefault();

            // 客户端校验（会议评审内容为非必填，此处仅做基础提交保护）
            try {
                elements.submitBtn.disabled = true;
                elements.submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>提交中...';

                const formData = new FormData(elements.form);
                const baseData = Object.fromEntries(formData.entries());

                const personalReports = [];
                document.querySelectorAll('textarea[name="weeklyReportContent"]').forEach((textarea) => {
                    personalReports.push({
                        name: textarea.dataset.name,
                        weeklyReportContent: textarea.value.trim()
                    });
                });

                const submitData = {
                    meetingAddress: baseData.meetingAddress,
                    host: baseData.host,
                    reviewContent: baseData.reviewContent,
                    personalWeeklyReports: personalReports
                };

                const { response, json, isFile } = await postJson(CONFIG.API_ENDPOINT, submitData);

                if (response.ok && isFile) {
                    // 1. 从响应头 Content-Disposition 提取文件名
                    let fileName = '部门周报.docx';
                    const disposition = response.headers.get('Content-Disposition');
                    if (disposition) {
                        try {
                            const utf8Match = disposition.match(/filename\*=UTF-8''([^;]+)/i);
                            if (utf8Match && utf8Match[1]) {
                                fileName = decodeURIComponent(utf8Match[1]);
                            } else {
                                const fileNameMatch = disposition.match(/filename="?([^";]+)"?/i);
                                if (fileNameMatch && fileNameMatch[1]) {
                                    fileName = fileNameMatch[1];
                                }
                            }
                        } catch (err) {
                            console.warn('文件名解析失败，使用默认值', err);
                        }
                    }

                    // 2. 下载文件
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);

                    showMessage(elements.responseMessage, '🎉 周报提交成功，文件已下载', 'success');
                } else if (response.ok) {
                    showMessage(elements.responseMessage,
                        (json && json.message) || '周报提交成功', 'success');
                } else {
                    if (response.status === 401) {
                        showMessage(elements.responseMessage, '未授权：请确认后端已启用鉴权且前端 API_TOKEN 与后端一致', 'error');
                    } else if (response.status === 429) {
                        showMessage(elements.responseMessage, '请求过于频繁，请稍后再试', 'error');
                    } else {
                        const msg = (json && json.message) || `提交失败（${response.status}）`;
                        showMessage(elements.responseMessage, msg, 'error');
                    }
                }
            } catch (error) {
                console.error('提交异常：', error);
                showMessage(elements.responseMessage, '网络异常，提交失败！', 'error');
            } finally {
                elements.submitBtn.disabled = false;
                elements.submitBtn.innerHTML = '<i class="fa fa-paper-plane mr-2"></i>提交周报';
            }
        });

        // ====================== Tab 切换逻辑 ======================
        function activateTab(tab) {
            elements.tabItems.forEach((item) => {
                const active = item === tab;
                item.classList.toggle('active', active);
                item.setAttribute('aria-selected', active ? 'true' : 'false');
            });
            elements.tabContents.forEach((content) => content.classList.remove('active'));
            document.getElementById(tab.getAttribute('data-tab')).classList.add('active');
        }

        elements.tabItems.forEach((tab) => {
            tab.addEventListener('click', () => activateTab(tab));
            tab.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    activateTab(tab);
                }
            });
        });

        // ====================== 个人周报查询逻辑 ======================
        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch (_) {
                // 降级方案
                try {
                    elements.personalReportContent.removeAttribute('readonly');
                    elements.personalReportContent.select();
                    document.execCommand('copy');
                    return true;
                } catch (e2) {
                    return false;
                }
            }
        }

        elements.copyPersonalReportBtn.addEventListener('click', async function () {
            const text = elements.personalReportContent.value;
            if (!text.trim()) return;
            const ok = await copyText(text);
            showMessage(
                elements.personalReportMessage,
                ok ? '已复制到剪贴板！' : '复制失败，请手动选择文本复制',
                ok ? 'success' : 'error'
            );
        });

        elements.getPersonalReportBtn.addEventListener('click', async function () {
            elements.personalReportMessage.classList.add('hidden');
            elements.personalReportContent.value = '';
            elements.copyPersonalReportBtn.disabled = true;
            elements.personalReportContent.setAttribute('readonly', 'readonly');

            const username = elements.userAccountInput.value.trim();
            const password = elements.userPasswordInput.value.trim();

            if (!username || !password) {
                showMessage(elements.personalReportMessage, '账号和密码不能为空！', 'error');
                return;
            }

            try {
                elements.getPersonalReportBtn.disabled = true;
                elements.getPersonalReportBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>加载中...';

                const { response, json } = await postJson(CONFIG.PERSONAL_API_ENDPOINT, { username, password });
                const result = json;

                if (response.ok && result && result.code === 0) {
                    const reportContent = result.data?.weeklyReportContent || '暂无个人周报数据';
                    elements.personalReportContent.value = reportContent;
                    elements.personalReportContent.removeAttribute('readonly');
                    elements.copyPersonalReportBtn.disabled = false;

                    const copied = await copyText(reportContent);
                    showMessage(
                        elements.personalReportMessage,
                        copied ? '周报获取成功，已自动粘贴至剪贴板！' : '周报获取成功，但自动复制失败，请点「复制内容」',
                        'success'
                    );
                } else {
                    if (response.status === 401) {
                        showMessage(elements.personalReportMessage, '未授权：请确认后端已启用鉴权且前端 API_TOKEN 与后端一致', 'error');
                    } else if (response.status === 429) {
                        showMessage(elements.personalReportMessage, '请求过于频繁，请稍后再试', 'error');
                    } else {
                        const msg = (result && result.message) || `获取失败（${response.status}）`;
                        showMessage(elements.personalReportMessage, msg, 'error');
                    }
                }
            } catch (error) {
                console.error('获取个人周报失败:', error);
                showMessage(elements.personalReportMessage, '网络异常，获取个人周报失败！', 'error');
            } finally {
                elements.getPersonalReportBtn.disabled = false;
                elements.getPersonalReportBtn.innerHTML = '<i class="fa fa-search mr-2"></i>获取个人周报';
            }
        });
    });
</script>

<!-- Service Worker：部署到 HTTP(S) 服务器后启用，缓存静态资源加速重复访问（file:// 下不注册） -->
<script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('./sw.js').catch(function (e) {
                console.warn('Service Worker 注册失败：', e);
            });
        });
    }
</script>
